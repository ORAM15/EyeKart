services:
  - type: web
    name: eyekart-web
    env: node
    plan: standard
    region: frankfurt # Low latency to East Africa (Kenya) peering
    buildCommand: cd server && npm ci --omit=dev
    startCommand: node server/src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: eyekart-db
          property: connectionString
      - key: DB_SSL
        value: true
      - key: STORAGE_PROVIDER
        value: S3
      - key: S3_REGION
        value: af-south-1
      - key: S3_BUCKET
        sync: false # Must be set securely in dashboard
      - key: S3_ACCESS_KEY_ID
        sync: false # Must be set securely in dashboard
      - key: S3_SECRET_ACCESS_KEY
        sync: false # Must be set securely in dashboard
      - key: SESSION_SECRET
        generateValue: true # Generates secure 32+ char secret
      - key: COOKIE_SECRET
        generateValue: true # Generates secure 32+ char secret
      - key: CORS_ORIGIN
        sync: false # Set to production domain (e.g. https://eyekart.onrender.com)

databases:
  - name: eyekart-db
    databaseName: eyekart_prod
    user: eyekart_admin
    plan: standard
    region: frankfurt
    ipAllowList: [] # Only internal services can connect
